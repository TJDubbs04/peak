name: An idea
description: Something you'd like Peak to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Peak to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would you use it?
      description: What you're doing at the time, and how you do it today.
